<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex practice</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0 auto;
            padding: 0;
        }
        body {
            max-width: 1000px;
            margin: 0 auto;
            border: 1px solid black;
        }
        header{
            display: grid;
            grid-template-columns: 100px 1fr;
        }
        header h1{
            text-align: center;
            grid-column: 1/3;
        }
        header nav{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <header>
        <h1>flex practice</h1>
        <div class="logo"><img src="https://picsum.photo"></div>
        <nav>
            <a href="#">link1</a>
            <a href="#">link 2</a>
            <a href="%">link 3</a>
            <a href="%">link4</a>
        </nav>
    </header>
    <main></main>
    <footer></footer>
</body>
</html>
