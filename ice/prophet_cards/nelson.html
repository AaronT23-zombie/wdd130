<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russell M. Nelson</title>
    <style>
        /* Insert styles here, this is called an internal stylesheet  */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #FFECD7;
            padding: 2em;
            font-family: helvetica;
        }
        .card img {
            max-width: 200px;
            border: 4px solid #fffffe;
            margin: 0.5em 0;
        }
        .card{
            text-align: center;
            width: 300px;
            margin: 0 auto;
            background-color: #008db1;
            padding: 1.5em;
            border: 3px solid #004e63;
            border-radius: 25px;
        }
        .card h1{
            color: #fffffe;
            font-size: .8em;
            margin: 0.25em 0;
        }
        .card h2{
            color: #91e4fb;
            font-size: .8em;
            text-align: center;
            margin: 0.25em 0;
        }
        .card a{
            text-decoration: none;
            color: #91e4fb;
        }
        .card a:visited{
            color: #91e4fb;
        }
        .card ul{
            text-align: left;
            width: 180px;
            margin: 0 auto;
            font-size: .8em;
            color: #fffffe;
        }
        .card blockquote{
            color: #ffd783;
        }
    </style>
</head>
<body>
    <main>
        <section class="card"></section>
    </main>
    
</body>
</html>
